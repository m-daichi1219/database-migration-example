version: "3.8"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sampledb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/flyway/sql
      - ../tests:/tests
    networks:
      - postgres_network

volumes:
  postgres_data:
    driver: local

networks:
  postgres_network:
    driver: bridge
